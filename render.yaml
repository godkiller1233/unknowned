# Render Blueprint for the root-level Unknown web service.
# DATABASE_URL is supplied manually in the Render dashboard; no database is provisioned here.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: unknown-chat-platform
    runtime: node
    plan: free
    region: oregon
    numInstances: 1
    autoDeployTrigger: commit
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATA_MODE
        value: registered
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://unknown-chat-platform.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/unknown-uploads
      - key: OFFICIAL_ACCOUNT_USERNAME
        value: Unknown
      - key: OFFICIAL_ACCOUNT_PASSWORD
        generateValue: true
